[package]
name = "tauri-plugin-single-instance"
version = "0.0.0"
description = "Ensure a single instance of your tauri app is running. Vendored from tauri-apps/plugins-workspace (branch v1, commit ed682dd) with a null-pointer guard in the Windows window procedure."
license = "Apache-2.0 OR MIT"
edition = "2021"
publish = false

[dependencies]
serde = "1"
serde_json = "1"
tauri = "1"
log = "0.4"
thiserror = "1"

[target.'cfg(target_os = "windows")'.dependencies.windows-sys]
version = "0.52"
features = [
    "Win32_System_Threading",
    "Win32_System_DataExchange",
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_Graphics_Gdi",
]

[target.'cfg(target_os = "linux")'.dependencies]
zbus = "3"
